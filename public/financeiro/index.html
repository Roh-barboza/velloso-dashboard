<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velloso Financeiro</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#f4f6f8;color:#172033}.s{position:fixed;inset:0 auto 0 0;width:220px;background:#0d1728;color:#cbd5e1;padding:24px 16px}.logo{color:#fff;font:700 20px Georgia;letter-spacing:.12em;margin:0 8px 28px}.logo small{display:block;color:#8b97a8;font:10px Segoe UI;letter-spacing:.16em}.nav button{width:100%;border:0;background:0;color:#cbd5e1;text-align:left;padding:11px;border-radius:9px;cursor:pointer;margin:3px 0}.nav button.on,.nav button:hover{background:#ffffff0e;color:#e8cc98}.m{margin-left:220px}.top{height:82px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0}.top h1{margin:0;font-size:21px}.top p{margin:4px 0 0;color:#778196;font-size:11px}.btn{border:1px solid #e2e7ed;background:#fff;padding:9px 12px;border-radius:9px;font-weight:700;cursor:pointer}.btn.p{background:#0d1728;color:#fff}.c{padding:24px 28px}.demo{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:9px 12px;border-radius:10px;margin-bottom:14px;font-size:11px}.hero{background:linear-gradient(120deg,#121f34,#1c3150);color:#fff;padding:18px;border-radius:15px;margin-bottom:14px}.hero b{color:#e1c48e}.hero h2{margin:5px 0;font-size:17px}.hero p{margin:0;color:#bdc7d4;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid #e4e8ee;border-radius:14px;padding:15px}.card span{font-size:10px;color:#6f7a8d}.card strong{display:block;font-size:23px;margin-top:11px}.r{color:#b93838}.g{color:#17734f}.panel h3{margin:0 0 12px}.q{display:flex;justify-content:space-between;gap:12px;padding:10px;border-top:1px solid #eef1f4}.q:first-of-type{border-top:0}.q small{display:block;color:#7b8596;margin-top:3px}.tag{font-size:9px;font-weight:700;padding:4px 6px;border-radius:99px;background:#fdecec;color:#b93838}.tag.ok{background:#e7f6ef;color:#17734f}.tools{display:flex;gap:8px;margin-bottom:12px}.tools input,.tools select{border:1px solid #e4e8ee;border-radius:9px;padding:9px;background:#fff}.tools input{flex:1}.tbl{background:#fff;border:1px solid #e4e8ee;border-radius:13px;overflow:auto}.tbl table{border-collapse:collapse;width:100%;min-width:800px}.tbl th,.tbl td{padding:10px;border-bottom:1px solid #eef1f4;text-align:left;font-size:11px}.tbl th{background:#f8fafc;color:#7a8494;font-size:9px;text-transform:uppercase}.modal{position:fixed;inset:0;background:#0f172a88;display:none;place-items:center}.modal.on{display:grid}.box{width:min(650px,92vw);background:#fff;border-radius:15px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:10px;color:#657083;font-weight:700}input,select{width:100%;margin-top:4px;border:1px solid #e4e8ee;border-radius:8px;padding:9px}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:800px){.s{display:none}.m{margin:0}.cards{grid-template-columns:1fr 1fr}.c,.top{padding-left:15px;padding-right:15px}.grid{grid-template-columns:1fr}}
</style></head><body><aside class="s"><div class="logo">VELLOSO<small>FINANCEIRO</small></div><div class="nav"><button class="on" data-v="d">Visão geral</button><button data-v="a">Contas a pagar</button></div></aside><main class="m"><header class="top"><div><h1 id="ttl">Visão geral</h1><p>Controle de contas que precisam ser subidas para pagamento.</p></div><button class="btn p" id="novo">＋ Nova conta</button></header><section class="c"><div class="demo">Demonstração web. Os dados ficam salvos somente neste navegador.</div><div id="app"></div></section></main><div class="modal" id="mod"><div class="box"><h3>Nova conta</h3><form id="f"><div class="grid"><label>Fornecedor<input id="forn" required></label><label>Descrição<input id="desc" required></label><label>Valor<input id="val" required></label><label>Subir até<input id="sub" type="date" required></label><label>Vencimento<input id="venc" type="date" required></label><label>Status<select id="st"><option value="todo">A subir</option><option value="flow">Subida / aprovação</option><option value="paid">Paga</option></select></label></div><div class="ma"><button type="button" class="btn" id="can">Cancelar</button><button class="btn p">Salvar</button></div></form></div></div><script>
var K='velloso_fin_demo',view='d',q='';function iso(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function dt(s){return new Date(s+'T12:00').toLocaleDateString('pt-BR')}function dif(s){return Math.round((new Date(s+'T12:00')-new Date(iso(0)+'T12:00'))/86400000)}var data=JSON.parse(localStorage.getItem(K)||'null')||[{id:1,forn:'Escritório Roma',desc:'Operação mensal Itália',val:4850,sub:iso(0),venc:iso(4),st:'todo'},{id:2,forn:'Contabilidade Velloso',desc:'Honorários contábeis',val:2500,sub:iso(3),venc:iso(8),st:'todo'},{id:3,forn:'DHL Express',desc:'Envio documental',val:326.43,sub:iso(-1),venc:iso(2),st:'todo'},{id:4,forn:'Google Workspace',desc:'Licenças corporativas',val:689.9,sub:iso(6),venc:iso(11),st:'flow'},{id:5,forn:'Microsoft',desc:'Licenças e serviços',val:1170,sub:iso(-9),venc:iso(-4),st:'paid'}];function save(){localStorage.setItem(K,JSON.stringify(data))}function tag(a){return a.st==='paid'?'<span class="tag ok">Paga</span>':a.st==='flow'?'<span class="tag">Em fluxo</span>':'<span class="tag">A subir</span>'}function render(){document.querySelectorAll('[data-v]').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});ttl.textContent=view==='d'?'Visão geral':'Contas a pagar';app.innerHTML=view==='d'?dash():accounts();bind()}function dash(){var u=data.filter(function(a){return a.st==='todo'&&dif(a.sub)<=3}),paid=data.filter(function(a){return a.st==='paid'}),open=data.filter(function(a){return a.st!=='paid'}).sort(function(a,b){return a.sub.localeCompare(b.sub)}),h=u[0];return (h?'<div class="hero"><b>AÇÃO PRIORITÁRIA</b><h2>'+(dif(h.sub)<0?'Prazo interno vencido':'Conta para subir hoje ou em breve')+'</h2><p>'+h.forn+' · '+h.desc+' · '+brl(h.val)+' · vence '+dt(h.venc)+'</p></div>':'')+'<div class="cards"><div class="card"><span>A subir / urgente</span><strong class="r">'+u.length+'</strong></div><div class="card"><span>Em aberto</span><strong>'+open.length+'</strong></div><div class="card"><span>Pagas</span><strong class="g">'+paid.length+'</strong></div><div class="card"><span>Total cadastrado</span><strong>'+brl(data.reduce(function(s,a){return s+a.val},0))+'</strong></div></div><div class="panel"><h3>Fila do financeiro</h3>'+open.slice(0,6).map(function(a){return '<div class="q"><div><b>'+a.forn+'</b><small>'+a.desc+' · subir até '+dt(a.sub)+'</small></div><div><b>'+brl(a.val)+'</b><br>'+tag(a)+'</div></div>'}).join('')+'</div>'}function accounts(){var rows=data.filter(function(a){return (a.forn+' '+a.desc).toLowerCase().indexOf(q.toLowerCase())>=0}).sort(function(a,b){return a.sub.localeCompare(b.sub)});return '<div class="tools"><input id="q" placeholder="Buscar fornecedor ou descrição" value="'+q+'"></div><div class="tbl"><table><thead><tr><th>Fornecedor</th><th>Valor</th><th>Subir até</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+rows.map(function(a){return '<tr><td><b>'+a.forn+'</b><br><small>'+a.desc+'</small></td><td><b>'+brl(a.val)+'</b></td><td class="'+(a.st==='todo'&&dif(a.sub)<=0?'r':'')+'"><b>'+dt(a.sub)+'</b></td><td>'+dt(a.venc)+'</td><td>'+tag(a)+'</td><td>'+(a.st==='todo'?'<button class="btn" data-sub="'+a.id+'">Subi</button> ':'')+(a.st!=='paid'?'<button class="btn" data-pay="'+a.id+'">Paga</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>'}function bind(){var x=document.getElementById('q');if(x)x.oninput=function(e){q=e.target.value;render()};document.querySelectorAll('[data-sub]').forEach(function(b){b.onclick=function(){data.find(function(a){return a.id==b.dataset.sub}).st='flow';save();render()}});document.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){data.find(function(a){return a.id==b.dataset.pay}).st='paid';save();render()}})}document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){view=b.dataset.v;render()}});novo.onclick=function(){sub.value=iso(3);venc.value=iso(7);mod.classList.add('on')};can.onclick=function(){mod.classList.remove('on')};f.onsubmit=function(e){e.preventDefault();if(sub.value>venc.value){alert('Subir até não pode ser depois do vencimento.');return}data.push({id:Date.now(),forn:forn.value,desc:desc.value,val:Number(val.value.replace(',','.'))||0,sub:sub.value,venc:venc.value,st:st.value});save();f.reset();mod.classList.remove('on');render()};render();
</script></body></html>
