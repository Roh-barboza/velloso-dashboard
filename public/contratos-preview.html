  <meta name="theme-color" content="#f3eee6">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#eee8df}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
      font-family:Arial,sans-serif;
    }
    .page{
      position:relative;
      width:min(100%,568px);
      aspect-ratio:568/638;
      overflow:hidden;
      border-radius:2px;
      box-shadow:0 20px 55px rgba(50,35,20,.14);
      background:#f7f1e7;
    }
    .page img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }
    .cta{
      position:absolute;
      left:23.4%;
      top:51.7%;
      width:53.7%;
      height:7.8%;
      z-index:3;
      border-radius:12px;
      cursor:pointer;
      text-indent:-9999px;
      overflow:hidden;
      background:transparent;
    }
    .cta:focus-visible{
      outline:3px solid rgba(109,15,39,.55);
      outline-offset:3px;
    }
    @media(max-width:620px){
      body{padding:0;background:#f7f1e7}
      .page{width:100vw;border-radius:0;box-shadow:none}
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Velloso Cidadania - Formulário de Contratos">
    <img src="/api/contracts-page" alt="Redirecionando você para o Formulário de Contratos da Velloso Cidadania">
    <a class="cta" href="https://forms.gle/XYKmKUTtBC9mhWev7" aria-label="Ir para o formulário de contratos">Ir para o formulário</a>
  </main>
  <script>
    const p=new URLSearchParams(location.search);
    if(!p.has('preview')){
      setTimeout(()=>location.replace('https://forms.gle/XYKmKUTtBC9mhWev7'),3500);
    }
  </script>
</body>
